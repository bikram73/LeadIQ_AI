<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Glass Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b2c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#006b2c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#006b2c" flood-opacity="0.06" />
    </filter>

    <filter id="emeraldGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="800" rx="40" fill="url(#bgGrad2)" />

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="250" r="200" fill="#10b981" opacity="0.1" filter="url(#emeraldGlowFilter)" />
  <circle cx="600" cy="550" r="220" fill="#006b2c" opacity="0.08" filter="url(#emeraldGlowFilter)" />

  <!-- Central Collaborative Workspace Card -->
  <g transform="translate(100, 100)" filter="url(#softShadow)">
    <rect x="0" y="0" width="600" height="600" rx="36" fill="url(#glassCard)" stroke="#ffffff" stroke-width="3" />
    <rect x="2" y="2" width="596" height="596" rx="34" fill="none" stroke="rgba(0,107,44,0.1)" stroke-width="1.5" />

    <!-- Top Header -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="520" height="60" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="35" cy="30" r="14" fill="#006b2c" />
      <path d="M 28 30 L 33 35 L 42 25" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <text x="62" y="36" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#0f172a">AI Sales Acceleration Hub</text>
      
      <rect x="390" y="16" width="110" height="28" rx="8" fill="#e6f4ea" />
      <text x="445" y="34" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#006b2c" text-anchor="middle">5x Speedup</text>
    </g>

    <!-- Main Hero Metric Card inside workspace -->
    <g transform="translate(40, 120)">
      <rect x="0" y="0" width="520" height="150" rx="24" fill="url(#emeraldGradient)" />
      
      <!-- Graphic overlay -->
      <circle cx="440" cy="75" r="90" fill="#ffffff" opacity="0.1" />
      <circle cx="440" cy="75" r="60" fill="#ffffff" opacity="0.1" />

      <text x="36" y="52" font-family="Inter, sans-serif" font-weight="800" font-size="32" fill="#ffffff">99.4% Precision</text>
      <text x="36" y="80" font-family="Inter, sans-serif" font-weight="500" font-size="15" fill="#e2e8f0">Automated Lead Scoring &amp; Instant Rep Routing</text>

      <!-- Stat Badges -->
      <g transform="translate(36, 100)">
        <rect x="0" y="0" width="130" height="32" rx="10" fill="rgba(255,255,255,0.2)" />
        <text x="65" y="21" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">&lt;3s Response</text>
      </g>
      <g transform="translate(180, 100)">
        <rect x="0" y="0" width="150" height="32" rx="10" fill="rgba(255,255,255,0.2)" />
        <text x="75" y="21" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle">24/7 Availability</text>
      </g>
    </g>

    <!-- Interactive Grid Cards (Analytics + Team Sync) -->
    <!-- Card 1: Revenue Velocity -->
    <g transform="translate(40, 290)">
      <rect x="0" y="0" width="245" height="180" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Revenue Growth</text>
      
      <!-- Wave Bar Graph -->
      <path d="M 20 140 Q 70 100, 120 120 T 225 60" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
      <path d="M 20 140 Q 70 100, 120 120 T 225 60 L 225 150 L 20 150 Z" fill="url(#accentGlow)" opacity="0.3" />
      <circle cx="225" cy="60" r="6" fill="#006b2c" />
    </g>

    <!-- Card 2: Qualification Breakdown -->
    <g transform="translate(315, 290)">
      <rect x="0" y="0" width="245" height="180" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="20" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="15" fill="#0f172a">Team Capacity</text>

      <!-- Circular gauge -->
      <circle cx="122" cy="110" r="40" stroke="#f1f5f9" stroke-width="10" fill="none" />
      <circle cx="122" cy="110" r="40" stroke="#006b2c" stroke-width="10" stroke-dasharray="200 250" fill="none" stroke-linecap="round" transform="rotate(-90 122 110)" />
      <text x="122" y="116" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#0f172a" text-anchor="middle">+320%</text>
    </g>

    <!-- Bottom Sync Bar -->
    <g transform="translate(40, 490)">
      <rect x="0" y="0" width="520" height="70" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="35" cy="35" r="16" fill="#006b2c" />
      <path d="M 28 35 L 33 40 L 42 30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <text x="65" y="32" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#0f172a">Zero Manual Data Entry</text>
      <text x="65" y="50" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#64748b">Instant synchronization with your CRM &amp; Sales Stack</text>
    </g>
  </g>
</svg>
